name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # semantic-release v25 requires Node >=22.14 (the test workflows stay on
          # 20; only this release job runs semantic-release).
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Fail-safe: semantic-release derives the last version from git tags, not
      # package.json. With no baseline tag it would cut a "first release" (v1.0.0)
      # from full history — regressing the current 1.4.0 and stamping it into every
      # manifest. Abort loudly instead (covers both push and manual workflow_dispatch
      # runs) until a baseline v-tag is seeded.
      - name: Ensure a baseline release tag exists
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "::error::No baseline 'v*' git tag found. Seed one before the first release:"
            echo "::error::  git tag -a v1.4.0 -m 'v1.4.0' <main-sha> && git push origin v1.4.0"
            echo "::error::Without it, semantic-release would cut a regressing first release (v1.0.0)."
            exit 1
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Doc Detective CLI installs agent tools from the floating major tag
      # (`v1`, `v2`), so point it at each stable release: v2.3.1 moves v2.
      # semantic-release tags the release commit it leaves at HEAD, so no
      # stable tag there means no release was cut, or it was a prerelease.
      # Only on main: a manual run against an old release tag would otherwise
      # find that tag at HEAD and move the major tag back to it.
      - name: Move the major version tag
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$version" ]; then
            echo "No stable release at HEAD. Leaving the major tag alone."
            exit 0
          fi
          major="${version%%.*}"
          git tag -f "$major" HEAD
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${major}"
          echo "Moved ${major} to ${version}."
