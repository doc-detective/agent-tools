name: Validate Skills

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "skills/**"
      - "agents/**"
      - "commands/**"
      - "hooks/**"
      - "plugins/doc-detective/**"
      - "build.js"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "skills/**"
      - "agents/**"
      - "commands/**"
      - "hooks/**"
      - "plugins/doc-detective/**"
      - "build.js"
      - "package.json"
      - "package-lock.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # build.js reads the action list from doc-detective-common.
      - name: Install dependencies
        run: npm ci

      - name: Build artifacts from src/
        run: npm run build:no-scripts

      # build.js stamps the current month into frontmatter `date:` lines, so
      # those lines are ignored. Any other difference means src/ wasn't built.
      - name: Check built output matches src/
        run: |
          git diff --exit-code -I '^ *date: ' -- skills agents commands hooks plugins/doc-detective || {
            echo "::error::Built output differs from src/. Run \`npm run build\` and commit the result."
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest

      - name: Validate skills
        run: |
          # Exit codes: 0 = pass, 1 = errors, 2 = warnings only.
          # Treat warnings (exit 2) as success; only fail on actual errors.
          set +e
          skill-validator check --emit-annotations skills/
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then exit 1; fi

      - name: Write step summary
        if: always()
        run: |
          skill-validator check -o markdown skills/ >> "$GITHUB_STEP_SUMMARY" || true
