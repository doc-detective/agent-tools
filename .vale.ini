# House voice for every document in this repo. The Moose package enables the
# Voices core, the Direct voice, and the Moose house rules for all Markdown
# and text files. No section exemptions: README, skills, agents, commands,
# and the built plugin copies are all held to the same voice.
#
# There is no [*.md] section here on purpose. Moose is a complete package:
# its own .vale.ini (installed to .vale/styles/.vale-config/ by `vale sync`)
# carries the [*.{md,mdx,txt}] section and the BasedOnStyles line. Adding a
# section here would replace that list for the files it matches, so any
# section added later must re-list Voices, Direct, Moose.
# Package source: https://github.com/hawkeyexl/moose-vale
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/hawkeyexl/moose-vale/releases/latest/download/Moose.zip
