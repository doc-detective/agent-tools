<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Change your display name</title>
</head>
<body>
  <h1>Change your display name</h1>
  <p>Your display name appears on comments and in the member list.</p>
  <ol>
    <li>Open <a href="https://app.example.com/settings/profile">Profile settings</a>.</li>
    <li>In the <strong>Display name</strong> field, type "Ada L.".</li>
    <li>Click <strong>Save changes</strong>.</li>
  </ol>
  <p>A <strong>Profile updated</strong> banner confirms the change.</p>
  <p>To change your email address instead, see <a href="https://docs.example.com/email">Change your email</a>.</p>
</body>
</html>
