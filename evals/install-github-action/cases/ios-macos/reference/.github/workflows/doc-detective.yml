name: Doc Detective

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  doc-detective:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: doc-detective/github-action@v2
        with:
          config: .doc-detective.json
